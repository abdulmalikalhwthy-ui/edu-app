<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شاشة الطالب</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <header>
    <h1>👨‍🎓 شاشة الطالب</h1>
    <div>
      <span class="user" id="user-name"></span>
      <a href="#" id="logout">خروج</a>
    </div>
  </header>

  <main>
    <div class="tabs">
      <button id="tab-form" class="active" type="button">✍️ صياغة سؤال جديد</button>
      <button id="tab-list" type="button">📋 أسئلتي</button>
    </div>

    <div id="view-form">
      <div class="card">
        <h2>الطريقة الصحيحة لصياغة السؤال المعرفي</h2>
        <form id="question-form"></form>
      </div>
    </div>

    <div id="view-list" style="display:none">
      <div id="questions-list"></div>
    </div>
  </main>

  <script src="js/recorder.js"></script>
  <script src="js/student.js"></script>

</html>

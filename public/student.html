<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شاشة الطالب</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <header>
    <h1>👨‍🎓 شاشة الطالب</h1>
    <div>
      <span class="user" id="user-name"></span>
      <span id="notif-badge" class="badge pending" style="display:none; cursor:pointer; margin-inline-end:8px">🔔 <span id="notif-count">0</span></span>
      <a href="#" id="enable-notifications" style="font-size:.72rem; padding:5px 10px; border-radius:12px; background:rgba(255,255,255,.25); color:#fff; text-decoration:none; margin-inline-end:8px; font-weight:700">🔔 تفعيل</a>
      <a href="#" id="logout">خروج</a>
    </div>
  </header>

  <main>
    <div id="live-alert" style="display:none" class="live-alert"></div>

    <div class="tabs tabs-scroll">
      <button id="tab-form" class="active" type="button">✍️ سؤال جديد</button>
      <button id="tab-list" type="button">📋 أسئلتي</button>
      <button id="tab-exams" type="button">📝 الامتحانات</button>
      <button id="tab-polls" type="button">📊 الاستطلاعات</button>
      <button id="tab-notifs" type="button">🔔 الإشعارات</button>
      <button id="tab-calls" type="button">📞 المكالمات</button>
    </div>

    <div id="view-form">
      <div class="card">
        <h2>الطريقة الصحيحة لصياغة السؤال المعرفي</h2>
        <form id="question-form"></form>
      </div>
    </div>

    <div id="view-list" style="display:none">
      <div id="questions-list"></div>
    </div>

    <div id="view-exams" style="display:none">
      <div class="card">
        <h2>📝 الامتحانات المتاحة</h2>
        <button id="refresh-exams" type="button">🔄 تحديث</button>
        <div id="exams-list" style="margin-top:14px"></div>
      </div>
    </div>

    <div id="view-polls" style="display:none">
      <div class="card">
        <h2>📊 الاستطلاعات النشطة</h2>
        <button id="refresh-polls" type="button">🔄 تحديث</button>
        <div id="polls-list" style="margin-top:14px"></div>
      </div>
    </div>

    <div id="view-notifs" style="display:none">
      <div class="card">
        <h2>🔔 الإشعارات</h2>
        <button id="read-all" type="button">✅ تحديد الكل كمقروء</button>
        <div id="notifs-list" style="margin-top:14px"></div>
      </div>
    </div>

    <div id="view-calls" style="display:none">
      <div class="card">
        <h2>📞 جهات الاتصال</h2>
        <p style="font-size:.85rem;color:var(--text-light);margin-bottom:14px">
          اختر شخصاً لبدء مكالمة صوتية أو مرئية
        </p>
        <div id="contacts-list"></div>
      </div>
    </div>
  </main>

  <script src="js/recorder.js"></script>
  <script src="js/push-client.js"></script>
  <script src="js/calls.js"></script>
  <script src="js/student.js"></script>
</body>
</html>

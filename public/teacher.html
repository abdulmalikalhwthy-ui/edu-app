<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شاشة الأستاذ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>👨‍🏫 شاشة الأستاذ</h1>
    <div>
      <span class="user" id="user-name"></span>
      <a href="#" id="logout">خروج</a>
    </div>
  </header>

  <main>
    <div class="tabs">
      <button id="tab-questions" class="active">📋 الأسئلة</button>
      <button id="tab-search">🔎 البحث</button>
      <button id="tab-students">👥 الطلاب</button>
    </div>

    <div id="view-questions">
      <div class="card">
        <h2>آخر الأسئلة الواردة</h2>
        <button id="refresh-btn">🔄 تحديث</button>
        <div id="questions-list" style="margin-top:14px"></div>
      </div>
    </div>

    <div id="view-search" style="display:none">
      <div class="card">
        <h2>محرك البحث في الآيات والروايات</h2>
        <div id="teacher-search"></div>
      </div>
    </div>

    <div id="view-students" style="display:none">
      <div class="card">
        <h2>⚙️ التحكم بتسجيل الطلاب</h2>
        <div class="field">
          <label>
            <input type="checkbox" id="restrict-toggle" style="width:auto; display:inline-block; margin-inline-end:8px;">
            قصر التسجيل على الطلاب المصرّح لهم فقط
          </label>
          <p style="font-size:.85rem; color:var(--text-light); margin-top:6px">
            عندما يكون مُفعّلاً، لن يستطيع أي طالب التسجيل إلا إذا أُضيف اسمه في القائمة أدناه.
          </p>
        </div>
      </div>

      <div class="card">
        <h2>📝 إضافة طالب جديد</h2>
        <div class="add-student-form">
          <input type="text" id="new-student-name" placeholder="اسم الطالب الكامل...">
          <button id="add-student-btn">➕ إضافة</button>
        </div>
      </div>

      <div class="card">
        <h2>👥 قائمة الطلاب المصرّح لهم (<span id="students-count">0</span>)</h2>
        <div id="students-list"></div>
      </div>
    </div>
  </main>

  <script src="js/recorder.js"></script>
  <script src="js/teacher.js"></script>
</body>
</html>

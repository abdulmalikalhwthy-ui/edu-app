<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شاشة الأستاذ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>👨‍🏫 شاشة الأستاذ</h1>
    <div>
      <span class="user" id="user-name"></span>
      <a href="#" id="logout">خروج</a>
    </div>
  </header>

  <main>
    <div class="tabs">
      <button id="tab-questions" class="active">📋 أسئلة الطلاب</button>
      <button id="tab-search">🔎 محرك البحث</button>
    </div>

    <div id="view-questions">
      <div class="card">
        <h2>آخر الأسئلة الواردة</h2>
        <button id="refresh-btn" style="margin-bottom:10px">🔄 تحديث</button>
        <div id="questions-list"></div>
      </div>
    </div>

    <div id="view-search" style="display:none">
      <div class="card">
        <h2>محرك البحث الآني في الآيات والروايات</h2>
        <div id="teacher-search"></div>
      </div>
    </div>
  </main>

  <script src="js/recorder.js"></script>
  <script src="js/teacher.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق السؤال المعرفي</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <header><h1>📚 تطبيق السؤال المعرفي</h1></header>

  <main>
    <div class="card login-box">
      <h2>تسجيل الدخول</h2>

      <div class="role-toggle">
        <button id="role-student" class="active" type="button">👨‍🎓 طالب</button>
        <button id="role-teacher" type="button">👨‍🏫 أستاذ</button>
      </div>

      <input type="text" id="name" placeholder="اكتب اسمك الكامل" autocomplete="off">
      <input type="email" id="email" placeholder="البريد الإلكتروني (اختياري)" autocomplete="off" style="direction:ltr; text-align:left">

      <div id="teacher-code-wrap" style="display:none">
        <input type="password" id="teacher-code" placeholder="🔐 رمز الأستاذ السري" autocomplete="off">
      </div>

      <button id="login-btn" type="button">🚪 دخول</button>

      <div id="login-status" style="margin-top:12px; font-size:.9rem; font-weight:600; min-height:20px;"></div>
    </div>
  </main>

  <script>
    let role = 'student';
    const roleStudent = document.getElementById('role-student');
    const roleTeacher = document.getElementById('role-teacher');
    const statusEl = document.getElementById('login-status');
    const codeWrap = document.getElementById('teacher-code-wrap');
    const codeInput = document.getElementById('teacher-code');
    const emailInput = document.getElementById('email');

    roleStudent.onclick = () => {
      role = 'student';
      roleStudent.classList.add('active');
      roleTeacher.classList.remove('active');
      codeWrap.style.display = 'none';
      statusEl.textContent = '';
    };

    roleTeacher.onclick = () => {
      role = 'teacher';
      roleTeacher.classList.add('active');
      roleStudent.classList.remove('active');
      codeWrap.style.display = 'block';
      statusEl.textContent = '';
    };

    const loginBtn = document.getElementById('login-btn');
    const nameInput = document.getElementById('name');

    async function doLogin() {
      const name = nameInput.value.trim();
      const email = emailInput.value.trim();

      if (!name) {
        statusEl.textContent = '⚠️ اكتب اسمك أولاً';
        statusEl.style.color = 'var(--warning)';
        nameInput.focus();
        return;
      }
      if (name.length < 3) {
        statusEl.textContent = '⚠️ الاسم قصير جداً';
        statusEl.style.color = 'var(--warning)';
        return;
      }
      if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        statusEl.textContent = '⚠️ البريد الإلكتروني غير صحيح';
        statusEl.style.color = 'var(--warning)';
        return;
      }

      loginBtn.disabled = true;
      const originalHTML = loginBtn.innerHTML;
      loginBtn.innerHTML = '⏳ جاري الدخول...';
      statusEl.textContent = '';

      try {
        const body = { name, email, role };
        if (role === 'teacher') body.teacher_code = codeInput.value;

        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await r.json();

        if (!r.ok) {
          if (data.error === 'not_allowed') statusEl.textContent = '🚫 ' + (data.message || 'لم يُصرّح لك');
          else if (data.error === 'wrong_code') { statusEl.textContent = '🔐 ' + (data.message || 'رمز خاطئ'); codeInput.value = ''; codeInput.focus(); }
          else statusEl.textContent = '❌ ' + (data.error || 'فشل الدخول');
          statusEl.style.color = 'var(--danger)';
          loginBtn.disabled = false;
          loginBtn.innerHTML = originalHTML;
          return;
        }

        statusEl.textContent = '✅ تم تسجيل الدخول...';
        statusEl.style.color = 'var(--success)';
        localStorage.setItem('user', JSON.stringify(data));

        setTimeout(() => {
          window.location.href = role === 'student' ? 'student.html' : 'teacher.html';
        }, 400);
      } catch (err) {
        statusEl.textContent = '❌ خطأ في الاتصال';
        statusEl.style.color = 'var(--danger)';
        loginBtn.disabled = false;
        loginBtn.innerHTML = originalHTML;
      }
    }

    loginBtn.onclick = doLogin;
    nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); doLogin(); } });
    emailInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); doLogin(); } });
    codeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); doLogin(); } });

    (function restore() {
      try {
        const saved = localStorage.getItem('user');
        if (saved) {
          const u = JSON.parse(saved);
          if (u && u.role) {
            nameInput.value = u.name;
            if (u.email) emailInput.value = u.email;
            role = u.role;
            roleStudent.classList.toggle('active', u.role === 'student');
            roleTeacher.classList.toggle('active', u.role === 'teacher');
            if (u.role === 'teacher') codeWrap.style.display = 'block';
          }
        }
      } catch (e) {}
    })();

    setTimeout(() => nameInput.focus(), 300);
  </script>
</body>
</html>
